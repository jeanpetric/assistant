# The assistant's entry for the ingress list of the tunnel cloudflared runs on
# the hub's server (docs/sync.md): Cloudflare serves the hostname over HTTPS
# and the tunnel hands its requests to nginx on loopback
# (deploy/nginx-assistant.conf).
#
# Merge into the existing tunnel config (e.g. /etc/cloudflared/config.yml):
# the hostname rule goes before the catch-all, and the list keeps exactly one
# catch-all, last. Then point DNS at the tunnel:
#   cloudflared tunnel route dns <tunnel> assistant.petricomp.com
ingress:
  - hostname: assistant.petricomp.com
    service: http://127.0.0.1:8768
  # ... the tunnel's other hostnames ...
  - service: http_status:404
