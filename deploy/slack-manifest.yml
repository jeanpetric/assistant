# Slack app for the assistant's Slack integration (docs/slack.md).
# Create it at https://api.slack.com/apps → Create New App → From an app manifest.
display_information:
  name: JeanBot
  description: Connects a Slack channel to a task in the assistant
features:
  bot_user:
    display_name: JeanBot
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
