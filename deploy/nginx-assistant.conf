# nginx in front of the assistant sync hub (docs/sync.md).
#
# Cloudflare terminates TLS and cloudflared hands the requests to this server
# on loopback, as plain HTTP; nginx passes only /sync/* on to the hub
# (sync_listen in the hub's config) and answers 404 to anything else. The UI,
# API and MCP on 127.0.0.1:6767 are never reachable from here.
#
# Install: /etc/nginx/sites-available/assistant, linked from sites-enabled.

# limit_req_zone belongs in the http {} block. Ubuntu's nginx.conf includes
# sites-enabled/* inside http {}, so this line works where it is; with a
# config that includes the file elsewhere, move it to http {}.
# Every request comes from 127.0.0.1 (cloudflared), so the limit is per
# client address as Cloudflare saw it.
limit_req_zone $http_cf_connecting_ip zone=assistant_sync:10m rate=10r/s;

server {
	# Loopback only: cloudflared is the one client.
	listen 127.0.0.1:8768;
	server_name assistant.petricomp.com;

	# A push carries up to 500 changes; Cloudflare's free plan stops at 100 MB.
	client_max_body_size 64m;

	location /sync/ {
		limit_req zone=assistant_sync burst=20 nodelay;
		limit_req_status 429;

		# No URI after the address: the path and query go to the hub as they
		# came, which matters because the signature covers them. X-Node,
		# X-Timestamp and X-Signature pass through untouched.
		proxy_pass http://127.0.0.1:6768;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Connection "";

		# A pull waits up to 30 s for changes (long-poll); the snapshot a
		# joining node downloads is streamed, not buffered to disk.
		proxy_buffering off;
		proxy_read_timeout 90s;
		proxy_send_timeout 90s;
	}

	location / {
		return 404;
	}
}
